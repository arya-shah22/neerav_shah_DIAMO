appId: com.diamo.erp
productName: DIAMO ERP
copyright: Copyright © 2025 Neerav Shah

publish:
  provider: github
  owner: arya-shah22
  repo: neerav_shah_DIAMO
  releaseType: release

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

asarUnpack:
  - "**/*.node"
  - "**/*.dll"
  - "**/*.dylib"
  - "**/*.so"
  - "**/query_engine*"

mac:
  category: public.app-category.business
  icon: resources/icons/icon.icns
  target:
    - dmg
    - zip

win:
  icon: resources/icons/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
