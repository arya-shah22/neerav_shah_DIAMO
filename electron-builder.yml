appId: com.diamo.erp
productName: DIAMO ERP
copyright: Copyright © 2025 Neerav Shah

publish:
  provider: github
  owner: arya-shah22
  repo: neerav_shah_DIAMO
  releaseType: release

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*
  - node_modules/.prisma/**/*
  - package.json

extraResources:
  # The GENERATED Prisma client (node_modules/.prisma) is not an npm package, so
  # electron-builder drops it when it builds node_modules from the dependency
  # tree — the `node_modules/.prisma/**/*` entry under `files:` does not save it.
  # Without this, @prisma/client/default.js throws
  # "Cannot find module '.prisma/client/default'" and the app dies on launch.
  # Copying it here works because Node resolves upward from resources/app.asar/
  # into resources/node_modules/. Per-platform engine selection is handled in
  # main.ts, which matches the query engine strictly by file extension.
  - from: "node_modules/.prisma"
    to: "node_modules/.prisma"
  - from: "node_modules/@prisma"
    to: "node_modules/@prisma"
  # Full DDL applied on first run when the database is empty (see db-bootstrap.ts).
  # Regenerate with `npm run db:gen-sql` whenever schema.prisma changes.
  - from: "prisma/schema.sql"
    to: "schema.sql"
  - from: "resources/bin"
    to: "bin"

asarUnpack:
  - "**/*.node"
  - "**/*.dll"
  - "**/*.dylib"
  - "**/*.so"
  - "**/query_engine*"
  - "**/node_modules/.prisma/**"
  - "**/node_modules/@prisma/**"

mac:
  category: public.app-category.business
  icon: resources/icons/icon.icns
  target:
    - dmg
    - zip

win:
  icon: resources/icons/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
