# ═══════════════════════════════════════════════════════════════
# DIAMO ERP — Continuous Integration & Cross-Platform Build Pipeline
# Builds, tests, obfuscates, and packages .exe & .dmg releases
# ═══════════════════════════════════════════════════════════════

name: Build & Release DIAMO ERP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Autonomous Software Verification Test Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diamo_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

      - name: Run TypeScript Static Analysis
        run: npx tsc --noEmit

      - name: Push Database Schema to Test MySQL
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

      - name: Seed Reference Data to Test MySQL
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

      - name: Run Full Software Master Test Suite (40/40 Modules)
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/test-full-software.ts
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

  build-windows:
    name: Build & Package Windows (.exe)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (Fresh Isolated Environment)
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native Windows Prisma Engine & Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/diamo_db"

      - name: Build & Obfuscate Bundle
        run: npm run build:vite
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/diamo_db"

      - name: Bundle Portable MySQL Engine for Windows Installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "resources/bin/mysql"
          if (Test-Path "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysqld.exe") {
            Copy-Item "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysqld.exe" "resources/bin/mysql/mysqld.exe" -Force
          } elseif (Test-Path "C:\Program Files\MySQL\MySQL Server 8.4\bin\mysqld.exe") {
            Copy-Item "C:\Program Files\MySQL\MySQL Server 8.4\bin\mysqld.exe" "resources/bin/mysql/mysqld.exe" -Force
          }

      - name: Publish & Create Windows Release Installers (.exe)
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    name: Build & Package macOS (.dmg)
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout Repository (Fresh Isolated Environment)
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native macOS Prisma Engine & Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/diamo_db"

      - name: Build & Obfuscate Bundle
        run: npm run build:vite
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/diamo_db"

      - name: Publish & Create macOS Release Installers (.dmg)
        run: npx electron-builder --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
