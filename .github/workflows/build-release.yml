# ═══════════════════════════════════════════════════════════════
# DIAMO ERP — Continuous Integration & Cross-Platform Build Pipeline
# Builds, tests, obfuscates, and packages .exe & .dmg releases
# ═══════════════════════════════════════════════════════════════

name: Build & Release DIAMO ERP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Autonomous Software Verification Test Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diamo_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

      - name: Run TypeScript Static Analysis
        run: npx tsc --noEmit

      - name: Push Database Schema to Test MySQL
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

      - name: Seed Reference Data to Test MySQL
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

      - name: Run Full Software Master Test Suite (40/40 Modules)
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/test-full-software.ts
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/diamo_test"

  build:
    name: Build & Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Engine & Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/diamo_db"

      - name: Build & Obfuscate Bundle
        run: npm run build:vite
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/diamo_db"

      - name: Compile Main Electron & Backend Entrypoint
        run: npx tsc

      - name: Publish & Create Release Installers (.exe / .dmg)
        uses: electron-userland/builder-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
